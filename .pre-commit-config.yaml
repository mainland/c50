# The local hooks run from `.venv`, which holds the pinned checkers:
#   python3 -m venv .venv
#   .venv/bin/python -m pip install -U pip
#   .venv/bin/python -m pip install --group dev
# Run `pre-commit run --all-files` to check the whole tree.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/python -m ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/python -m ruff format --check
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: .venv/bin/python -m mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: [--toml, pyproject.toml]
        # Before Python 3.11, codespell reads the TOML file through `tomli`.
        additional_dependencies: [tomli]
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.3.4
    hooks:
      - id: rumdl
