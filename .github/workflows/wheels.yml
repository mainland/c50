name: Wheels

# Build the source distribution, then build and test wheels from it, so that
# the wheels prove that the sdist is complete. Publication is a separate,
# manual step.
on:
  push:
    branches: [main, dev, 'topic/**']
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdist:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Build the source distribution
        run: |
          python -m pip install build twine
          python -m build --sdist
      - name: Check the source distribution
        run: |
          python tests/check_sdist.py dist/*.tar.gz
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    needs: sdist
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Split macOS by architecture so that the x86-64 wheels, which are
        # tested under Rosetta 2, build in parallel with the arm64 wheels.
        include:
          - {os: ubuntu-24.04, archs: native}
          - {os: ubuntu-24.04-arm, archs: native}
          - {os: macos-14, archs: arm64}
          - {os: macos-14, archs: x86_64}
          - {os: windows-2022, archs: AMD64}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: sdist
      - name: Locate the source distribution
        shell: bash
        run: echo "C50_SDIST=$(ls sdist/*.tar.gz)" >> "$GITHUB_ENV"
      - uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
        with:
          package-dir: ${{ env.C50_SDIST }}
          output-dir: wheelhouse
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.archs }}
          path: wheelhouse/*.whl

  checksums:
    needs: wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Record SHA-256 digests of the tested distributions
        run: |
          cd dist
          sha256sum *.tar.gz *.whl | tee SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
