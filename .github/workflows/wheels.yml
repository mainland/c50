name: Wheels

# Build the source distribution, then build and test wheels from it, so that
# the wheels prove that the sdist is complete. Publication is a separate,
# manual step.
on:
  push:
    branches: [main, dev, 'topic/**']
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdist:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build the source distribution
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build --sdist
      - name: Check the source distribution
        run: |
          python tests/check_sdist.py dist/*.tar.gz
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    needs: sdist
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Split macOS by architecture so that the x86-64 wheels, which are
        # tested under Rosetta 2, build in parallel with the arm64 wheels.
        include:
          - {os: ubuntu-24.04, archs: native}
          - {os: ubuntu-24.04-arm, archs: native}
          - {os: macos-15, archs: arm64}
          - {os: macos-15, archs: x86_64}
          - {os: windows-2022, archs: AMD64}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: sdist
      - name: Locate the source distribution
        shell: bash
        run: echo "C50_SDIST=$(ls sdist/*.tar.gz)" >> "$GITHUB_ENV"
      - uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
        with:
          package-dir: ${{ env.C50_SDIST }}
          output-dir: wheelhouse
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.archs }}
          path: wheelhouse/*.whl

  # The Windows wheels need the Visual C++ Redistributable and do not bundle
  # it. GitHub's Windows runners have the redistributable, so the wheel tests
  # above cannot notice a missing runtime DLL. Run each wheel in a Server Core
  # container, which lacks the redistributable, with an embeddable CPython that
  # brings its own vcruntime140.dll and vcruntime140_1.dll. The script checks
  # that the wheel holds no runtime DLL, that it fails to import, installs the
  # redistributable from Microsoft after it verifies the installer's signature,
  # and then imports and trains. The container shares the runner's kernel
  # (process isolation), and the runner image matches ltsc2022.
  windows-clean-import:
    needs: wheels
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The embeddable packages are pinned by SHA-256. python.org publishes
        # MD5 digests for 3.11 and 3.12 and Sigstore bundles for 3.13 and
        # later, and each digest below agrees with them. 3.11 and 3.12 have no
        # later releases with binaries.
        include:
          - {tag: cp311, python: 3.11.9, sha256: 009d6bf7e3b2ddca3d784fa09f90fe54336d5b60f0e0f305c37f400bf83cfd3b}
          - {tag: cp312, python: 3.12.10, sha256: 4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3}
          - {tag: cp313, python: 3.13.17, sha256: 9e35319bffedab8b36ad44d8f377cb4f1733bcec257a0b6d04d94f01486ddb38}
          - {tag: cp314, python: 3.14.10, sha256: 90905e64a840557d8c1bc4f5b74db3d7ee85e3ffb217611cac1c7813acea4159}
    env:
      IMAGE: mcr.microsoft.com/windows/servercore:ltsc2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels-windows-2022-AMD64
          path: wheelhouse
      - name: Fetch the embeddable CPython
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          PYTHON_SHA256: ${{ matrix.sha256 }}
        run: |
          $zip = "python-$env:PYTHON_VERSION-embed-amd64.zip"
          Invoke-WebRequest -UseBasicParsing -OutFile $zip `
            "https://www.python.org/ftp/python/$env:PYTHON_VERSION/$zip"
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash
          if ($actual -ne $env:PYTHON_SHA256) {
            throw "SHA-256 of $zip is $actual, not $env:PYTHON_SHA256."
          }
          Expand-Archive -Path $zip -DestinationPath embed
      - name: Fetch the Visual C++ Redistributable
        run: |
          New-Item -ItemType Directory -Path vcredist | Out-Null
          Invoke-WebRequest -UseBasicParsing `
            -OutFile vcredist\vc_redist.x64.exe `
            https://aka.ms/vc14/vc_redist.x64.exe
      - name: Pull the Server Core image
        run: docker pull $env:IMAGE
      - name: Check the wheel in a container without the C++ runtime
        env:
          TAG: ${{ matrix.tag }}
        run: |
          docker run --rm --isolation=process `
            --mount "type=bind,source=$PWD\wheelhouse,target=C:\wheelhouse,readonly" `
            --mount "type=bind,source=$PWD\embed,target=C:\embed,readonly" `
            --mount "type=bind,source=$PWD\tests,target=C:\tests,readonly" `
            --mount "type=bind,source=$PWD\vcredist,target=C:\vcredist,readonly" `
            $env:IMAGE powershell -NoProfile -NonInteractive `
            -File C:\tests\windows_clean_import.ps1 -Tag $env:TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  checksums:
    needs: [wheels, windows-clean-import]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Record SHA-256 digests of the tested distributions
        run: |
          cd dist
          sha256sum *.tar.gz *.whl | tee SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
