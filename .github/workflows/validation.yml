name: Validation

on:
  push:
    branches: [main, dev, 'topic/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - os: ubuntu-24.04-arm
            cc: gcc
            cxx: g++
          - os: macos-15
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The locale tests skip when no decimal-comma locale exists.
      - name: Generate a decimal-comma locale
        if: runner.os == 'Linux'
        run: sudo locale-gen de_DE.UTF-8
      # Verify that targets request C++17 even with an older project default.
      # Every job treats warnings as errors: -Werror here and /WX on Windows.
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_CXX_STANDARD=14
          -DCMAKE_CXX_FLAGS='-Wall -Wextra -Wpedantic -Werror'
      - name: Build and test native and installed interfaces
        run: |
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Check production and verbose Make workflows
        if: matrix.os == 'ubuntu-24.04' && matrix.cc == 'gcc'
        run: |
          make -j2 test
          make -j2 c5.0dbg
          C50_BINARY="$PWD/c5.0dbg" ./tests/test_verbose.sh

  # Python packages compile the core with C50_PRIVATE_CORE, and inlining
  # across source files can change floating-point rounding where the compiler
  # fuses a multiplication and an addition, as GCC does on ARM64. Check that
  # this configuration reproduces the reference classifiers.
  private-core:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cxx: g++
          - os: ubuntu-24.04-arm
            cxx: g++
          - os: macos-15
            cxx: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Request link-time optimization explicitly, so that configuration fails
      # instead of continuing without it.
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DC50_PRIVATE_CORE=ON
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
      - name: Build and test
        run: |
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

  # Clang writes LLVM bitcode for a private core when the configuration sets no
  # interprocedural optimization variable, and the default linker on Linux must
  # then load the Clang plugin. Leave the variable unset to check that the
  # programs link.
  private-core-clang:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=clang++
          -DC50_PRIVATE_CORE=ON
      - name: Build and test
        run: |
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      # CMake needs pybind11 and the test dependencies before it configures
      # the extension. The installed package also serves the last step.
      - name: Install the Python package
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: python -m pip install '.[test]' 'pybind11>=2.13'
      # Match the GCC and Clang policy of -Wall -Wextra -Werror without
      # -Wconversion: C4244, C4267, and C4305 report implicit narrowing
      # conversions, which the imported sources use deliberately to store
      # values as float. Every other level-4 warning is an error. Visual Studio
      # is a multi-configuration generator, so the build-tree Python tests
      # check that the extension lands next to its package.
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_CXX_STANDARD=14
          -DCMAKE_CXX_FLAGS='/W4 /WX /wd4244 /wd4267 /wd4305 /EHsc'
          -DC50_BUILD_PYTHON=ON
          "-DPython_EXECUTABLE=$((Get-Command python).Source)"
          "-Dpybind11_DIR=$(python -m pybind11 --cmakedir)"
      # PowerShell reports only the exit status of a step's last command, so
      # give each command its own step.
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test native and installed interfaces
        run: ctest --test-dir build --build-config Release --output-on-failure
      - name: Test the Python package
        env:
          SCIPY_ARRAY_API: '1'
        run: python -m pytest

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # The local hooks run ruff and mypy from `.venv`.
      - name: Install the pinned checkers
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -U pip
          .venv/bin/python -m pip install --group dev
      - name: Run the pre-commit hooks
        run: .venv/bin/pre-commit run --all-files --show-diff-on-failure

  python-and-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            dependencies: minimum
            constraints: 'joblib==1.3.0 numpy==1.26.4 pandas==2.2.3 scikit-learn==1.6.1'
          - python: '3.11'
            dependencies: latest
            constraints: ''
          - python: '3.12'
            dependencies: latest
            constraints: ''
          - python: '3.13'
            dependencies: latest
            constraints: ''
          - python: '3.14'
            dependencies: latest
            constraints: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Generate a decimal-comma locale
        run: sudo locale-gen de_DE.UTF-8
      - name: Install documentation tools and the package
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
          python -m pip install '.[test,docs]' ${{ matrix.constraints }}
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
      # The tutorial test downloads its data from OpenML. Run it in one job
      # and cache the data so that most runs need no network access.
      - name: Cache the tutorial data
        if: matrix.python == '3.12' && matrix.dependencies == 'latest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/scikit_learn_data
          key: openml-tutorial-${{ hashFiles('docs/tutorial.md') }}
          restore-keys: openml-tutorial-
      - name: Test the installed Python package and public types
        env:
          SCIPY_ARRAY_API: '1'
          C50_NETWORK_TESTS: ${{ matrix.python == '3.12' && matrix.dependencies == 'latest' && '1' || '' }}
        run: |
          python -m pytest
          python -m mypy
          python -m mypy.stubtest --allowlist tests/typing/stubtest-allowlist.txt c50._c50
          python tests/benchmark_smoke.py
      - name: Check the benchmark's separate Python build
        if: matrix.python == '3.12' && matrix.dependencies == 'latest'
        run: |
          python -m pip install 'pybind11>=2.13.6'
          python tests/benchmark_smoke.py --build-python
      - name: Build strict Doxygen and Sphinx documentation
        if: matrix.python == '3.12' && matrix.dependencies == 'latest'
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
