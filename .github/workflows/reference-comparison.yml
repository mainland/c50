name: Reference comparison

on:
  push:
    branches: [main, dev, 'topic/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-comparison-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build C5.0 Release 2.07 from the `main` branch and train generated data
  # with it and with the library's c5.0. The trees, rules, and console output
  # must match. The script builds the reference with -ffp-contract=off, so it
  # keeps the x86-64 arithmetic on every runner. The default ARM64 and macOS
  # entries then show whether the library's default build matches the x86-64
  # classifier, and the entries that build the library with -ffp-contract=off
  # show whether that flag restores it. The macOS entries use Apple Clang,
  # which contracts multiplications and additions within a statement by
  # default. On macOS, `gcc` is Apple Clang or a Homebrew GCC. Either one
  # builds the reference with the flags that the script passes.
  release-207:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            flags: ''
          - os: ubuntu-24.04-arm
            flags: ''
          - os: ubuntu-24.04-arm
            flags: '-ffp-contract=off'
          - os: macos-15
            flags: ''
          - os: macos-15
            flags: '-ffp-contract=off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: release-207
          persist-credentials: false
      - name: Configure
        env:
          FLAGS: ${{ matrix.flags }}
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_FLAGS="$FLAGS"
      - name: Build the library's c5.0
        run: cmake --build build --parallel 2 --target c50_cli
      - name: Compare with Release 2.07
        run: tests/reference/run.sh build/c5.0 release-207
