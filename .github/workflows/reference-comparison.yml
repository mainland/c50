name: Reference comparison

on:
  push:
    branches: [main, dev, 'topic/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-comparison-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build C5.0 Release 2.07 from the `main` branch and train generated data
  # with it and with this tree's c5.0. The trees, rules, and console output
  # must match. Until the tree has a CMake build, `build_reference.sh` builds
  # the candidate as the imported Makefile does, without its csh steps, and
  # always with -ffp-contract=off, so both ARM64 entries build it alike.
  release-207:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            flags: ''
          - os: ubuntu-24.04-arm
            flags: ''
          - os: ubuntu-24.04-arm
            flags: '-ffp-contract=off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: release-207
          persist-credentials: false
      # The imported sources are under src/. Build them with the source list
      # of Release 2.07's Makefile.
      - name: Build this tree's c5.0
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          mkdir stage
          cp src/*.c src/*.i release-207/Makefile stage/
          C50_REFERENCE_CFLAGS="$FLAGS" tests/reference/build_reference.sh stage c5.0
      - name: Compare with Release 2.07
        run: tests/reference/run.sh ./c5.0 release-207
