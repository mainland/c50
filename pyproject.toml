[build-system]
requires = [
    "scikit-build-core>=0.10",
    "setuptools-scm>=9",
    "pybind11>=2.13",
]
build-backend = "scikit_build_core.build"

[project]
name = "c50"
dynamic = ["version"]
description = "Python bindings for the C5.0 Release 2.07 GPL Edition core"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["gpl.txt"]
authors = [
    {name = "Geoffrey Mainland"},
]
classifiers = [
    "Programming Language :: C",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mainland/c50"
Repository = "https://github.com/mainland/c50"
Issues = "https://github.com/mainland/c50/issues"

[project.optional-dependencies]
sklearn = [
    "joblib>=1.3",
    "numpy>=1.26",
    "scikit-learn>=1.6",
]
test = [
    "array-api-compat>=1.9",
    "array-api-strict>=2.6",
    "hypothesis>=6.112",
    "joblib>=1.3",
    "mypy>=1.11",
    "numpy>=1.26",
    "pandas>=2.2",
    "pytest>=8",
    "setuptools-scm>=9",
    "scikit-learn>=1.6",
]
docs = [
    "breathe",
    "furo",
    "joblib>=1.3",
    "myst-parser",
    "numpy>=1.26",
    "scikit-learn>=1.6",
    "sphinx>=7",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["python/c50"]
wheel.exclude = ["**/*.cpp"]
install.components = ["python"]
sdist.exclude = [
    ".hypothesis/**",
    ".mypy_cache/**",
    ".venv/**",
    "AGENTS.md",
    "build*/**",
    "dist/**",
    "docs/_build/**",
    "notes/**",
    "python/*.egg-info/**",
    "wheelhouse/**",
]

[tool.scikit-build.cmake.define]
C50_BUILD_PYTHON = true
BUILD_TESTING = false

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]

[tool.setuptools_scm.scm.git]
describe_command = [
    "git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.mypy]
files = ["python/c50", "tests/typing"]
mypy_path = "python"
strict = true

[[tool.mypy.overrides]]
module = ["joblib", "joblib.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.cibuildwheel]
# Build the supported CPython versions only. Free-threaded builds and
# prerelease interpreters are not validated.
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
build-frontend = "build"
test-extras = ["test"]
test-command = "python -m pytest {project}/tests/python"
test-environment = { SCIPY_ARRAY_API = "1" }

[tool.cibuildwheel.linux]
archs = ["native"]

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]
# C++17 library features such as std::optional need macOS 10.14 or newer.
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
