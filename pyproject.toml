[build-system]
requires = [
    "scikit-build-core>=0.10",
    "setuptools-scm>=9",
    "pybind11>=3.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "c50"
dynamic = ["version"]
description = "C5.0 decision trees and rulesets, with a scikit-learn estimator"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["gpl.txt"]
authors = [
    {name = "Geoffrey Mainland"},
]
keywords = ["C5.0", "decision trees", "rule learning", "classification", "scikit-learn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mainland/c50"
Repository = "https://github.com/mainland/c50"
Issues = "https://github.com/mainland/c50/issues"

[project.optional-dependencies]
sklearn = [
    "joblib>=1.3",
    "numpy>=1.26",
    "scikit-learn>=1.6",
]
test = [
    "array-api-compat>=1.9",
    "array-api-strict>=2.6",
    "hypothesis>=6.112",
    "joblib>=1.3",
    "mypy>=1.11",
    "numpy>=1.26",
    "pandas>=2.2",
    "pytest>=8",
    "setuptools-scm>=9",
    "scikit-learn>=1.6",
]
docs = [
    "breathe",
    "furo",
    "joblib>=1.3",
    "myst-parser",
    "numpy>=1.26",
    "scikit-learn>=1.6",
    "sphinx>=7",
]

[dependency-groups]
# Contributor tools. The lint environment installs them with
# `pip install --group dev`, which needs pip 25.1 or newer. The checkers whose
# findings matter are pinned exactly, so that every environment reproduces them.
# mypy reads Hypothesis's types through the property test and the hunt.
dev = [
    "hypothesis>=6.112",
    "mypy==2.4.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "pre-commit==4.7.0",
    "ruff==0.17.5",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["python/c50"]
wheel.exclude = ["**/*.cpp"]
install.components = ["python"]
sdist.exclude = [
    ".hypothesis/**",
    ".mypy_cache/**",
    ".venv/**",
    "AGENTS.md",
    "benchmarks/results/**",
    "build*/**",
    "dist/**",
    "docs/_build/**",
    "notes/**",
    "python/*.egg-info/**",
    "wheelhouse/**",
]

[tool.scikit-build.cmake.define]
C50_BUILD_PYTHON = true
# The wheel installs only the extension, so compile its core with link-time
# optimization and hidden symbols.
C50_PRIVATE_CORE = true
BUILD_TESTING = false

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]

[tool.setuptools_scm.scm.git]
describe_command = [
    "git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*",
]

[tool.ruff]
# Code, comments, and docstrings are limited to 79 columns.
line-length = 79
src = ["benchmarks", "tests"]

[tool.ruff.lint]
select = [
    "E", "E501", "F", "B", "SIM", "I", "UP", "C4", "PT", "RUF", "D",
    "ISC", "EXE", "PLW1510",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.mypy]
files = [
    "python/c50",
    "tests/typing",
    "benchmarks",
    "docs/conf.py",
    "tests/benchmark_smoke.py",
    "tests/check_license_notices.py",
    "tests/check_sdist.py",
    "tests/run_built_python.py",
    "tests/built_python_site",
    "tests/slow/property_hunt.py",
    "tests/reference",
]
mypy_path = "python:tests/python"
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code", "redundant-expr", "truthy-bool",
]

[[tool.mypy.overrides]]
module = ["joblib", "joblib.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true

# The benchmark scripts use pandas only through frames typed as Any, and
# pybind11 only when a run builds the Python extension. Neither is a type-check
# dependency, so skip their stubs instead of adding pandas-stubs, whose release
# must track pandas.
[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "pybind11"]
ignore_missing_imports = true

[tool.cibuildwheel]
# Build the supported CPython versions only. Free-threaded builds and
# prerelease interpreters are not validated.
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
build-frontend = "build"
test-extras = ["test"]
test-command = "python -m pytest {project}/tests/python"
test-environment = { SCIPY_ARRAY_API = "1" }

[tool.cibuildwheel.linux]
archs = ["native"]

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]
# C++17 library features such as std::optional need macOS 10.14 or newer.
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
# The extension imports MSVCP140.dll from the Visual C++ Redistributable, which
# Python installers do not ship. The wheel does not bundle it, so no repair
# runs. Say so explicitly, so that a cibuildwheel default cannot add one.
repair-wheel-command = ""

[tool.codespell]
# The fixtures and expected outputs hold generated text and bytes that the
# project compares exactly. `ExtraC`, `aLow`, and `DElt` are identifiers of
# the imported sources.
skip = "tests/expected/*,tests/fixtures/*,tests/fuzz/corpus/*"
ignore-words-list = "extrac,alow,delt"
